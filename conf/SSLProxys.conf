<IfModule mod_macro.c>
<IfModule mod_ssl.c>
<Macro SSLProxy $host $port $protocol $proxyip $proxyport $certdir $phpversion>
<VirtualHost *:$port>
        ServerName                      $host
        ErrorDocument 503               "<h1>503</h1><p>The service is not active.</p>"
        SSLEngine                       on
        SSLProxyEngine                  on
        SSLProtocol                     -all +TLSv1.2 +TLSv1.3
        SSLHonorCipherOrder             on
        SSLCompression                  off
        ProxyRequests                   off
        ProxyPreserveHost               on
        SSLProxyVerify                  none
        SSLProxyCheckPeerCN             off
        SSLProxyCheckPeerName           off
        SSLProxyCheckPeerExpire         off
        SSLCertificateFile              $certdir/cert.pem
        SSLCertificateKeyFile           $certdir/privkey.pem

        RewriteEngine                   on

        UseCanonicalPhysicalPort        Off
        UseCanonicalName                Off

        ProxyPass        / $protocol://$proxyip:$proxyport/ flushpackets=On connectiontimeout=300 timeout=300
        ProxyPassReverse / $protocol://$proxyip:$proxyport/
        ProxyTimeout     600

        RewriteCond %{HTTP:Connection} Upgrade [NC]
        RewriteCond %{HTTP:Upgrade} websocket [NC]
        RewriteRule /(.*) wss://$proxyip:$proxyport/$1  [P,L]

        SetEnvIf Cookie "(^|;\ *)csrftoken=([^;\ ]+)" csrftoken=$2
        RequestHeader set  X-CSRFToken "%{csrftoken}e"
        AllowEncodedSlashes On
        ProxyPassMatch ^/(ws)$  ws://$proxyip:$proxyport/$1

#       > HSTS (mod_headers is required) (15768000 seconds = 6 months)
        <IfModule mod_headers.c>
                Header always set Strict-Transport-Security "max-age=15768000; includeSubDomains"
        </IfModule>

#       PHPINIDir /srv/www/$host/php

#       ErrorLog  ${APACHE_LOG_DIR}/Proxy_$host_error.log
#       CustomLog ${APACHE_LOG_DIR}/Proxy_$host_access.log combined

#       > Encoded slashes need to be allowed
#       AllowEncodedSlashes     NoDecode

#       > Forbid access to /error/
        ProxyPass /error/ !

#       > Block Proxy for letsencrypt verification!
        ProxyPass        /.well-known !

#       > Uniq php version
        <FilesMatch \.php$>
                SetHandler "proxy:unix:/run/php/php$phpversion-fpm.sock|fcgi://localhost"
        </FilesMatch>

#       > Server Status
        <IfModule mod_status.c>
                <Location /server-status>
                        SetHandler server-status
                        Order deny,allow
                        Deny from all
                        Allow from 127.0.0.1
                </Location>
        </IfModule>
</VirtualHost>
</Macro>
</IfModule>
</IfModule>
